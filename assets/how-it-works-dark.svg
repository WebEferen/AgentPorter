<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="title desc">
<title id="title">How AgentPorter works</title>
<desc id="desc">Eight phases: recover, survey, target, deps, contract, strategy, implement and verify. Recover is for binaries only. Target is skipped with --to. Target and strategy require approval; recover and deps pause when a decision is needed. A GAP found by verify returns to implement. State in .porter/ lets a port stop and resume.</desc>
