<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
<title id="t">How AgentPorter works</title>
<desc id="d">Eight phases: recover, survey, target, deps, contract, strategy, implement per unit, verify. Recover, target, deps and strategy stop for your approval. Gaps found by verify go back to implement.</desc>
