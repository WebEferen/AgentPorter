<text x="58" y="140" font-size="13" fill="#57606A">Reverse engineer a binary</text>
<text x="58" y="158" font-size="13" fill="#57606A">with REA and probes</text>
<rect x="56" y="162" width="75" height="20" rx="10" fill="#F1F5F9"/>
<text x="64" y="176" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#0F172A">recover/</text>
