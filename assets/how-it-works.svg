<text x="318" y="111" font-size="17" font-weight="700" fill="#0F172A">survey</text>
<text x="290" y="140" font-size="13" fill="#57606A">Modules, public API, tests</text>
<text x="290" y="158" font-size="13" fill="#57606A">and risk signals</text>
