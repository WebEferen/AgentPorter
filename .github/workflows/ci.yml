name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Package builds and runs
        run: |
          python -m pip install .
          agentporter --version
          cd "$RUNNER_TEMP" && agentporter init --source "$GITHUB_WORKSPACE" --to typescript && agentporter state validate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Markdown
        run: npx -y markdownlint-cli2@0.18.1 "**/*.md"
      - name: Brand SVGs stay small
        run: |
          for f in assets/logo.svg assets/logo-dark.svg assets/icon.svg assets/how-it-works.svg assets/how-it-works-dark.svg; do
            size=$(wc -c < "$f")
            echo "$f: $size bytes"
          done
          # The porter silhouette has more geometry than the former bell icon.
          for f in assets/logo.svg assets/logo-dark.svg assets/icon.svg assets/social-preview.svg; do
            test "$(wc -c < "$f")" -le 12288
          done
          for f in assets/how-it-works.svg assets/how-it-works-dark.svg; do
            test "$(wc -c < "$f")" -le 32768
          done

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin and marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
